name: Deploy to Azure Container Apps (Runner Build)

on:
  workflow_dispatch:
    inputs:
      resource_group:
        description: "Azure Resource Group name"
        required: true
        default: "state-machine-rg"
      location:
        description: "Azure region (e.g. japaneast)"
        required: true
        default: "japaneast"
      acr_name:
        description: "Azure Container Registry name"
        required: true
        default: "statemachineacr2026"
      environment_name:
        description: "Container Apps Environment name"
        required: true
        default: "state-machine-env"
      azure_openai_endpoint:
        description: "Azure OpenAI endpoint URL"
        required: true
      azure_openai_deployment:
        description: "Azure OpenAI deployment name"
        required: true
        default: "gpt-4o-mini"
      azure_openai_api_version:
        description: "Azure OpenAI API version"
        required: true
        default: "2024-10-21"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FRONTEND_APP: state-machine-frontend
      BACKEND_APP: state-machine-backend
      RESOURCE_GROUP: ${{ github.event.inputs.resource_group }}
      LOCATION: ${{ github.event.inputs.location }}
      ACR_NAME: ${{ github.event.inputs.acr_name }}
      ENVIRONMENT_NAME: ${{ github.event.inputs.environment_name }}
      AZURE_OPENAI_ENDPOINT: ${{ github.event.inputs.azure_openai_endpoint }}
      AZURE_OPENAI_DEPLOYMENT: ${{ github.event.inputs.azure_openai_deployment }}
      AZURE_OPENAI_API_VERSION: ${{ github.event.inputs.azure_openai_api_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Create Resource Group
        run: |
          az group create --name "$RESOURCE_GROUP" --location "$LOCATION"

      - name: Create Azure Container Registry
        run: |
          az acr create --resource-group "$RESOURCE_GROUP" --name "$ACR_NAME" --sku Basic --admin-enabled true

      - name: Log in to ACR
        run: |
          az acr login --name "$ACR_NAME"

      - name: Build and push images
        run: |
          docker build -t "${ACR_NAME}.azurecr.io/${FRONTEND_APP}:latest" ./frontend
          docker push "${ACR_NAME}.azurecr.io/${FRONTEND_APP}:latest"
          docker build -t "${ACR_NAME}.azurecr.io/${BACKEND_APP}:latest" ./backend
          docker push "${ACR_NAME}.azurecr.io/${BACKEND_APP}:latest"

      - name: Create Container Apps Environment
        run: |
          az containerapp env create --resource-group "$RESOURCE_GROUP" --name "$ENVIRONMENT_NAME" --location "$LOCATION"

      - name: Create Managed Identities
        run: |
          az identity create --resource-group "$RESOURCE_GROUP" --name "${BACKEND_APP}-identity"
          az identity create --resource-group "$RESOURCE_GROUP" --name "${FRONTEND_APP}-identity"

      - name: Assign AcrPull role
        run: |
          ACR_ID=$(az acr show --name "$ACR_NAME" --resource-group "$RESOURCE_GROUP" --query id -o tsv)
          BACKEND_PRINCIPAL=$(az identity show --resource-group "$RESOURCE_GROUP" --name "${BACKEND_APP}-identity" --query principalId -o tsv)
          FRONTEND_PRINCIPAL=$(az identity show --resource-group "$RESOURCE_GROUP" --name "${FRONTEND_APP}-identity" --query principalId -o tsv)
          az role assignment create --assignee "$BACKEND_PRINCIPAL" --role AcrPull --scope "$ACR_ID"
          az role assignment create --assignee "$FRONTEND_PRINCIPAL" --role AcrPull --scope "$ACR_ID"

      - name: Deploy backend
        env:
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
        run: |
          BACKEND_IDENTITY_ID=$(az identity show --resource-group "$RESOURCE_GROUP" --name "${BACKEND_APP}-identity" --query id -o tsv)
          az containerapp create \
            --resource-group "$RESOURCE_GROUP" \
            --name "$BACKEND_APP" \
            --environment "$ENVIRONMENT_NAME" \
            --image "${ACR_NAME}.azurecr.io/${BACKEND_APP}:latest" \
            --user-assigned "$BACKEND_IDENTITY_ID" \
            --registry-server "${ACR_NAME}.azurecr.io" \
            --registry-identity "$BACKEND_IDENTITY_ID" \
            --ingress internal \
            --target-port 8000 \
            --secrets "azure-openai-api-key=${AZURE_OPENAI_API_KEY}" \
            --env-vars \
              "AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}" \
              "AZURE_OPENAI_API_KEY=secretref:azure-openai-api-key" \
              "AZURE_OPENAI_DEPLOYMENT=${AZURE_OPENAI_DEPLOYMENT}" \
              "AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION}" \
              "DATABASE_URL=sqlite:////tmp/models.db"

      - name: Deploy frontend
        run: |
          BACKEND_FQDN=$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$BACKEND_APP" --query "properties.configuration.ingress.fqdn" -o tsv)
          FRONTEND_IDENTITY_ID=$(az identity show --resource-group "$RESOURCE_GROUP" --name "${FRONTEND_APP}-identity" --query id -o tsv)
          az containerapp create \
            --resource-group "$RESOURCE_GROUP" \
            --name "$FRONTEND_APP" \
            --environment "$ENVIRONMENT_NAME" \
            --image "${ACR_NAME}.azurecr.io/${FRONTEND_APP}:latest" \
            --user-assigned "$FRONTEND_IDENTITY_ID" \
            --registry-server "${ACR_NAME}.azurecr.io" \
            --registry-identity "$FRONTEND_IDENTITY_ID" \
            --ingress external \
            --target-port 3000 \
            --env-vars "BACKEND_HOST=${BACKEND_FQDN}"
