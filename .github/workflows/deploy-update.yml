name: Update Azure Container Apps (existing deployment)

on:
  workflow_dispatch:
    inputs:
      resource_group:
        description: "Azure Resource Group name"
        required: true
        default: "state-machine-rg"
      acr_name:
        description: "Azure Container Registry name"
        required: true
        default: "statemachineacr2026"
      azure_openai_endpoint:
        description: "Azure OpenAI endpoint URL"
        required: true
        default: "https://ai-hackathon-free-resource.openai.azure.com/openai/v1"
      azure_openai_deployment:
        description: "Azure OpenAI deployment name"
        required: true
        default: "gpt-4o-mini"
      azure_openai_api_version:
        description: "Azure OpenAI API version"
        required: true
        default: "2024-10-21"

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      FRONTEND_APP: state-machine-frontend
      BACKEND_APP: state-machine-backend
      RESOURCE_GROUP: ${{ github.event.inputs.resource_group }}
      ACR_NAME: ${{ github.event.inputs.acr_name }}
      AZURE_OPENAI_ENDPOINT: ${{ github.event.inputs.azure_openai_endpoint }}
      AZURE_OPENAI_DEPLOYMENT: ${{ github.event.inputs.azure_openai_deployment }}
      AZURE_OPENAI_API_VERSION: ${{ github.event.inputs.azure_openai_api_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        run: |
          az acr login --name "$ACR_NAME"

      - name: Build and push backend image
        run: |
          docker build -t "${ACR_NAME}.azurecr.io/${BACKEND_APP}:latest" ./backend
          docker push "${ACR_NAME}.azurecr.io/${BACKEND_APP}:latest"

      - name: Build and push frontend image
        run: |
          docker build -t "${ACR_NAME}.azurecr.io/${FRONTEND_APP}:latest" ./frontend
          docker push "${ACR_NAME}.azurecr.io/${FRONTEND_APP}:latest"

      - name: Update backend Container App
        env:
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
        run: |
          SUFFIX="v$(date +%Y%m%d%H%M)"
          az containerapp update \
            --name "$BACKEND_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "${ACR_NAME}.azurecr.io/${BACKEND_APP}:latest" \
            --revision-suffix "$SUFFIX"

      - name: Update frontend Container App
        run: |
          BACKEND_FQDN=$(az containerapp show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$BACKEND_APP" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          SUFFIX="v$(date +%Y%m%d%H%M)"
          az containerapp update \
            --name "$FRONTEND_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "${ACR_NAME}.azurecr.io/${FRONTEND_APP}:latest" \
            --set-env-vars "BACKEND_HOST=${BACKEND_FQDN}" \
            --revision-suffix "$SUFFIX"

      - name: Verify deployment
        run: |
          echo "==> Container App status"
          az containerapp list \
            --resource-group "$RESOURCE_GROUP" \
            --query "[].{name:name, status:properties.runningStatus}" \
            --output table

          FRONTEND_URL=$(az containerapp show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$FRONTEND_APP" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "Frontend URL: https://${FRONTEND_URL}"

          echo "Waiting 30s for new revision to start..."
          sleep 30

          echo "==> Health check"
          curl -sf "https://${FRONTEND_URL}/nginx-health" && echo " [OK]" || echo " [FAILED]"
          curl -sf "https://${FRONTEND_URL}/health" && echo " [OK]" || echo " [FAILED]"
